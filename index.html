<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#70849f" />
    <meta name="description" content="Compact offline-ready retail point of sale" />
    <title>S.P Fahim POS</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <strong class="brand">S.P Fahim</strong>
        <div class="session-card">
          <span>Fahim Muntachir Sifat (POS-01)</span>
          <button id="logoutButton" type="button"><span aria-hidden="true">↪</span> Logout</button>
        </div>
        <div class="header-tools">
          <span class="status-dot" id="networkStatus" title="Network status"><i></i><span>Online</span></span>
          <label class="paper-control" title="Thermal paper width">
            <span>Receipt</span>
            <select id="paperSize" aria-label="Thermal receipt size"><option value="58">58mm</option><option value="80">80mm</option></select>
          </label>
          <button class="theme-button" id="themeToggle" type="button" aria-label="Switch to dark theme" title="Light / Dark theme"><span id="themeIcon" aria-hidden="true">☾</span></button>
        </div>
      </header>

      <main class="main-shell">
        <section class="entry-strip" aria-label="Sale information">
          <div class="entry-field barcode-field">
            <label for="barcodeInput">Scan or Enter Bar Code</label>
            <div class="barcode-box">
              <input id="barcodeInput" autocomplete="off" autofocus />
              <button id="searchProduct" type="button" aria-label="Find product" title="Find product (F3)">⌕</button>
            </div>
            <p class="field-message" id="barcodeMessage" role="status"></p>
          </div>

          <div class="entry-field customer-field">
            <div class="customer-label-row">
              <label for="customerInput" id="customerLabel">Mobile Number</label>
              <button class="link-button hidden" id="changeCustomer" type="button">Change</button>
            </div>
            <div class="customer-chip hidden" id="customerChip">
              <span class="customer-avatar" aria-hidden="true">✓</span>
              <span class="customer-details"><strong id="customerChipName">Customer</strong><small id="customerChipPhone"></small></span>
              <button id="removeCustomer" type="button" aria-label="Remove customer">×</button>
            </div>
            <div class="customer-entry" id="customerEntry">
              <span class="sr-only" id="customerInputIcon" aria-hidden="true">☎</span>
              <input id="customerInput" inputmode="tel" autocomplete="off" placeholder="Optional" maxlength="11" />
              <button class="skip-button hidden" id="skipCustomerName" type="button">Skip</button>
            </div>
            <p class="field-message" id="customerMessage" role="status"></p>
          </div>

          <div class="entry-field">
            <label for="customerSerial">Customer Serial</label>
            <input id="customerSerial" value="0002" readonly />
          </div>
          <div class="entry-field">
            <label for="dateDisplay">Date</label>
            <input id="dateDisplay" readonly />
          </div>
          <div class="entry-field">
            <label for="invoiceNumber">Invoice No</label>
            <input id="invoiceNumber" value="1001" readonly />
          </div>

        </section>

        <section class="content-grid">
          <section class="cart-card" aria-label="Current cart">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>SL</th><th>Product Code</th><th>Product Name</th><th>Qty</th><th>Price</th><th>Total</th><th>Stock</th><th><span class="sr-only">Action</span></th></tr>
                </thead>
                <tbody id="cartBody"></tbody>
              </table>
              <div class="empty-cart" id="emptyCart"><span>Your product list will appear here</span></div>
            </div>
            <div class="cart-footer">
              <span id="cartCount">0 items</span>
              <button id="clearCart" type="button">Clear All</button>
            </div>
          </section>

          <aside class="checkout-panel">
            <div class="checkout-title"><h1>Billing Summary</h1></div>
            <dl class="summary-list">
              <div><dt>Total Items</dt><dd id="summaryItems">0</dd></div>
              <div><dt>Total Qty</dt><dd id="summaryQty">0</dd></div>
              <div><dt>Sub Total</dt><dd id="summarySubtotal">0.00 TK</dd></div>
            </dl>
            <label class="amount-field" for="discountInput"><span>Discount</span><span class="money-input"><input id="discountInput" inputmode="decimal" value="0.00" /></span></label>
            <div class="payable-box"><span>Net Payable</span><strong id="summaryPayable">0.00 TK</strong></div>
            <label class="amount-field" for="paidInput"><span>Paid Amount</span><span class="money-input"><input id="paidInput" inputmode="decimal" /></span></label>
            <div class="settlement-row"><span id="settlementLabel">Change Return</span><strong id="settlementAmount">0.00 TK</strong></div>
            <div class="summary-divider"></div>
            <div class="checkout-actions">
              <button class="save-button" id="saveSale" type="button">Save Sale</button>
              <button class="print-button" id="printOnly" type="button">Print Invoice</button>
              <button class="paid-button" id="paidPrint" type="button">Paid &amp; Print</button>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <div class="modal-backdrop hidden" id="productModal" role="dialog" aria-modal="true" aria-labelledby="productModalTitle">
      <section class="modal-card">
        <div class="modal-head"><div><small>PRODUCT CATALOGUE</small><h2 id="productModalTitle">Find Product</h2></div><button class="modal-close" id="closeProductModal" type="button" aria-label="Close">×</button></div>
        <div class="modal-search"><span aria-hidden="true">⌕</span><input id="productSearchInput" placeholder="Search by name, barcode or code" autocomplete="off" /></div>
        <div class="product-list" id="productList"></div>
      </section>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>
    <section class="receipt" id="receipt" aria-hidden="true"></section>
    <script src="./app.js" defer></script>
  </body>
</html>
